name: Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Adjust refresh schedule here. By default, it runs once per day.
    # Syntax reference: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#schedule
    # Recommended tool: https://crontab.guru/
    - cron: "12 5 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Check out ArxivFeed
        uses: actions/checkout@v5
        with:
          repository: NotCraft/ArxivFeed
          ref: 666803907c51655b22dd541ef2cdc11e21309def
          path: .arxivfeed
      - name: Build HTTPS-compatible ArxivFeed
        run: |
          sed -i 's#http://export.arxiv.org#https://export.arxiv.org#' \
            .arxivfeed/src/core/query.rs
          cargo build --release --locked --manifest-path .arxivfeed/Cargo.toml
          cp .arxivfeed/target/release/arxivfeed ./arxivfeed
          chmod +x arxivfeed
      - name: Build rss
        run: ./arxivfeed
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true
